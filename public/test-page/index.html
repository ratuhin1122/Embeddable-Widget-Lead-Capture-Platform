<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Website — Widget Test Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #fff;
    }
    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .page-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .page-header p {
      font-size: 16px;
      opacity: 0.85;
    }
    .info-banner {
      max-width: 600px;
      margin: 0 auto 30px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      font-size: 14px;
      line-height: 1.6;
    }
    .info-banner code {
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .widget-container {
      max-width: 500px;
      margin: 0 auto;
    }
    .origin-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>🌐 Customer Website</h1>
    <p>This page simulates a customer's website on a <strong>different origin</strong>.</p>
    <div class="origin-badge">
      Origin: <strong id="current-origin"></strong>
    </div>
  </div>

  <div class="info-banner">
    <strong>How it works:</strong> The widget below is loaded from <code>http://localhost:3000</code>
    (a different origin than this page). The <code>&lt;script&gt;</code> tag fetches the widget config,
    renders the form, and submits data cross-origin via CORS.
  </div>

  <div class="widget-container">
    <!-- 
      ⬇️ THE EMBED SNIPPET ⬇️
      Replace WIDGET_ID_HERE with an actual widget ID from your API.
      Example: After creating a widget via POST /api/widgets, paste its ID below.
    -->
    <script src="http://localhost:3000/widget.js?id=WIDGET_ID_HERE"></script>
  </div>

  <script>
    document.getElementById('current-origin').textContent = window.location.origin;
  </script>
</body>
</html>
